# Visit https://github.com/lowlighter/metrics/blob/master/action.yml for full reference
name: Update README cards

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - ".github/assets/**"

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Stats
        uses: lowlighter/metrics@latest
        with:
          user: Nirikshak01
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          committer_token: ${{ github.token }}
          filename: .github/assets/metrics-stats.svg
          base: header, activity, community, repositories
          repositories_affiliations: owner
          config_timezone: Asia/Kolkata

      - name: Repository Metrics
        uses: lowlighter/metrics@latest
        with:
          user: Nirikshak01
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          committer_token: ${{ github.token }}
          filename: .github/assets/metrics-repository.svg
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          plugin_followup: yes
          plugin_languages: yes
          plugin_languages_limit: 5
          plugin_languages_details: percentage
          plugin_languages_threshold: 0%
          plugin_languages_ignored: html, css, JavaScript, TypeScript, Jupyter Notebook

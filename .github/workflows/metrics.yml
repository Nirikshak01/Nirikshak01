name: Update README cards

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Update profile metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ github.token }}
          user: Nirikshak01
          filename: .github/assets/metrics-stats.svg
          base: header, activity, community, repositories
          repositories_affiliations: owner
          config_timezone: Asia/Kolkata

      - name: Update activity calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ github.token }}
          user: Nirikshak01
          filename: .github/assets/metrics-activity.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Asia/Kolkata

      - name: Update repository metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ github.token }}
          user: Nirikshak01
          filename: .github/assets/metrics-repository.svg
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          plugin_followup: yes
          plugin_languages: yes
          plugin_languages_limit: 5
          plugin_languages_details: percentage
          plugin_languages_threshold: 0%
          plugin_languages_ignored: html, css, JavaScript, TypeScript, Jupyter Notebook
